<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cohere-aegis-theme") || localStorage.getItem("lc-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.classList.remove("light", "dark");
            document.documentElement.classList.add(t);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cohere Aegis</title>
    <meta name="description" content="Cohere Aegis - Intelligent Workforce Operations, Attendance, and Monitoring Platform" />

    <meta property="og:title" content="Cohere Aegis" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root">Loading Cohere Aegis...</div>

</html>
