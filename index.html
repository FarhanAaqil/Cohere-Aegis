<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lc-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.classList.remove("light", "dark");
            document.documentElement.classList.add(t);
          }
        } catch (e) {}
      })();
    </script>
